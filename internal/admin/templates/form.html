{{define "form"}}
{{template "header" .}}
{{$f := .Form}}
<form method="post" action="/admin/models/save" class="card">
	<input type="hidden" name="csrf" value="{{.CSRF}}">
	<input type="hidden" name="id" value="{{$f.ID}}">

	<label>
		<span>名称（后台列表里认得出来就行）</span>
		<input type="text" name="name" value="{{$f.Name}}" placeholder="主用 / 备用测试">
	</label>

	<label>
		<span>提供商</span>
		<select name="provider">
			{{range .Providers}}
			<option value="{{.Value}}" {{if eq $f.Provider .Value}}selected{{end}}>{{.Label}}</option>
			{{end}}
		</select>
		<span class="hint">决定请求协议：OpenAI 兼容走 /chat/completions，Anthropic 走 /v1/messages，Gemini 走 /v1beta/models/{模型}:generateContent。</span>
	</label>

	<label>
		<span>API 地址</span>
		<input type="text" name="base_url" value="{{$f.BaseURL}}" placeholder="https://api.openai.com/v1">
		<span class="hint">填到版本段为止；不带 /v1（/v1beta）时程序会自动补上。</span>
	</label>

	<label>
		<span>API Key</span>
		<input type="text" name="api_key" value="{{$f.KeyValue}}" placeholder="{{if .KeyGiven}}已保存 {{$f.KeyMasked}}，留空则不修改{{else}}填完整密钥{{end}}">
	</label>

	<label>
		<span>模型</span>
		<input type="text" name="model" value="{{$f.Model}}" placeholder="gpt-4o-mini / claude-sonnet-4-5 / gemini-2.5-flash">
	</label>

	<label>
		<span>人设（system 提示词）</span>
		<textarea name="persona" placeholder="你是 QQ 群的助手，回答要短、口语化，不要用 markdown 标题。">{{$f.Persona}}</textarea>
	</label>

	<div class="row">
		<label>
			<span>温度</span>
			<input type="number" name="temperature" step="0.1" min="0" max="2" value="{{$f.Temperature}}">
		</label>
		<label>
			<span>最大 tokens</span>
			<input type="number" name="max_tokens" min="1" max="32000" value="{{$f.MaxTokens}}">
		</label>
		<label>
			<span>超时（毫秒）</span>
			<input type="number" name="timeout_ms" min="1000" max="300000" value="{{$f.TimeoutMS}}">
		</label>
	</div>

	<label class="check">
		<input type="checkbox" name="enabled" value="1" {{if $f.Enabled}}checked{{end}}>
		<span>启用（同一时刻只有这一条生效）</span>
	</label>

	<button type="submit">保存</button>
	<a class="btn" style="background:#fff;color:#1b6ef3" href="/admin/models">返回列表</a>
</form>
{{template "footer"}}
{{end}}
