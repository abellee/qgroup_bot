{{define "header"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Title}} · QQ 群机器人后台</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #1c1c1c; background: #f6f7f9; }
a { color: #1b6ef3; text-decoration: none; }
.top { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #fff; border-bottom: 1px solid #e3e6ea; }
.brand { font-weight: 600; }
.top nav { margin-left: auto; display: flex; align-items: center; gap: 14px; }
main { padding: 20px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 18px; margin: 0 0 16px; }
.err { background: #fdecea; color: #a4262c; border: 1px solid #f5c6c6; padding: 8px 12px; border-radius: 6px; }
.flash { background: #e9f7ef; color: #1e7c3c; border: 1px solid #bfe5cc; padding: 8px 12px; border-radius: 6px; }
.empty { color: #5a6169; }
table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; overflow: hidden; }
th, td { padding: 10px 12px; border-bottom: 1px solid #eef0f3; text-align: left; vertical-align: top; }
th { background: #fafbfc; font-weight: 600; color: #4a5058; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.url, .persona { max-width: 260px; word-break: break-all; color: #4a5058; }
.on { color: #1e7c3c; font-weight: 600; }
.ops { white-space: nowrap; }
.ops a { margin-right: 10px; }
.card { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 20px; max-width: 720px; }
.narrow { max-width: 340px; margin: 60px auto; }
label { display: block; margin-bottom: 14px; }
label span { display: block; margin-bottom: 4px; color: #4a5058; }
.hint { color: #7a828b; font-size: 12px; margin-top: 4px; }
input[type=text], input[type=number], input[type=password], select, textarea {
	width: 100%; padding: 8px 10px; border: 1px solid #cfd4da; border-radius: 6px; background: #fff; font: inherit; color: inherit;
}
textarea { min-height: 120px; }
.row { display: flex; gap: 16px; }
.row > label { flex: 1; }
button, .btn { display: inline-block; padding: 8px 16px; border: 1px solid #1b6ef3; border-radius: 6px; background: #1b6ef3; color: #fff; font: inherit; cursor: pointer; }
button.danger { background: #fff; color: #a4262c; border-color: #e0b4b4; }
.inline { display: inline; }
.check { display: flex; align-items: center; gap: 8px; }
.check input { width: auto; }
</style>
</head>
<body>
<header class="top">
	<span class="brand">QQ 群机器人后台</span>
	{{if .Username}}
	<nav>
		<a href="/admin/models">模型</a>
		<span>{{.Username}}</span>
		<form method="post" action="/admin/logout" class="inline">
			<input type="hidden" name="csrf" value="{{.CSRF}}">
			<button type="submit">退出</button>
		</form>
	</nav>
	{{end}}
</header>
<main>
<h1>{{.Title}}</h1>
{{if .Err}}<p class="err">{{.Err}}</p>{{end}}
{{if .Flash}}<p class="flash">{{.Flash}}</p>{{end}}
{{end}}

{{define "footer"}}
</main>
</body>
</html>
{{end}}
