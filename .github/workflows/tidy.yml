name: tidy

# There is no Go toolchain on the working machine, so this job resolves the
# module graph once and hands go.mod/go.sum back as an artifact to commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - run: go mod tidy

      - uses: actions/upload-artifact@v4
        with:
          name: gomod
          path: |
            go.mod
            go.sum
